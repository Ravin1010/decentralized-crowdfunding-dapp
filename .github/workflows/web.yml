name: Frontend build

on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture generated lockfile for foundation reproducibility
        run: |
          echo "BEGIN_GENERATED_PACKAGE_LOCK"
          cat package-lock.json
          echo "END_GENERATED_PACKAGE_LOCK"
      - name: Typecheck and build
        run: npm run build
